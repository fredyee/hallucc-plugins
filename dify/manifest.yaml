version: 0.2.0
type: plugin
author: fredyee
name: hallucc
label:
  en_US: HallucC
  zh_Hans: HallucC 幻觉检测
description:
  en_US: >-
    HallucC detects factual hallucinations in AI-generated content with
    multi-source search verification, evaluates full agent execution
    trajectories (six-dimension scoring, failure-mode classification,
    hallucination propagation DAG), guards against prompt injection and
    jailbreaks (OWASP LLM Top 10), classifies Computer-Use Agent action
    risk (L0-L3), and performs static audit of Agent source code
    (dangerous imports, permission boundaries, injection surfaces,
    sandbox absence).
  zh_Hans: >-
    HallucC 多源搜索交叉核验 AI 生成内容中的事实性幻觉（逐条声明标注
    证实/证伪/存疑并附来源），支持 Agent 执行轨迹全链路评估（六维评分、
    失败模式分类、幻觉传播 DAG）、Prompt 注入/越狱安全网关
    （对齐 OWASP LLM Top 10）、Computer-Use Agent 动作风险分级（L0-L3）
    以及 Agent 源码静态审计（危险导入、权限边界、注入面、沙箱缺失检测）。
icon: icon.png
privacy: PRIVACY.md
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/hallucc.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: 2026-09-18T00:00:00Z
