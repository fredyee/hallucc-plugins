      en_US: Create an API key at https://aihcc.cloud/keys
      zh_Hans: 在 https://aihcc.cloud/keys 创建 API Key
    url: https://aihcc.cloud/keys
tools:
  - tools/halluc_detect.yaml
  - tools/halluc_detect_trajectory.yaml
  - tools/guard_check.yaml
  - tools/cua_classify.yaml
extra:
  python:
    source: provider/hallucc.py
