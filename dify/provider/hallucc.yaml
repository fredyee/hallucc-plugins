      HallucC: AI hallucination detection, agent trajectory evaluation,
      safety guardrails and CUA action risk classification.
    zh_Hans: >-
      HallucC：AI 幻觉检测、Agent 轨迹全链路评估、安全护栏与 CUA 动作风险分级。
